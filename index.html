<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>urc site</title>
<style>
  :root {
    --bg: #faf9f7;
    --fg: #1a1815;
    --muted: #6b6560;
    --accent: #c2410c;
    --line: #e5e1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614;
      --fg: #f2efea;
      --muted: #9a938c;
      --accent: #fb923c;
      --line: #2e2b28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
                 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(38px, 11vw, 64px);
    line-height: 1.05;
    letter-spacing: -.03em;
    margin: 0 0 18px;
  }
  p {
    font-size: 17px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 auto 36px;
    max-width: 42ch;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0 auto 24px; width: 64px; }
  footer { font-size: 13px; color: var(--muted); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .92em;
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <main>
    <span class="badge">Coming soon</span>
    <h1>urc site</h1>
    <p>아직 준비 중인 페이지예요. 곧 여기에 진짜 내용이 올라갑니다.</p>
    <hr>
    <footer>Hosted on GitHub Pages · <code>urc-site</code></footer>
  </main>
</body>
</html>
